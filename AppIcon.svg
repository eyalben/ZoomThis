<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A7CFF"/>
      <stop offset="100%" stop-color="#1B3A8C"/>
    </linearGradient>

    <!-- Glass lens gradient - translucent feel -->
    <radialGradient id="lensGrad" cx="0.4" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#C8DEFF" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#8BB4F0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5A8FE0" stop-opacity="0.75"/>
    </radialGradient>

    <!-- Rim metallic gradient -->
    <linearGradient id="rimGrad" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#F0F2F8"/>
      <stop offset="30%" stop-color="#D8DCE8"/>
      <stop offset="70%" stop-color="#B8BCC8"/>
      <stop offset="100%" stop-color="#E0E4F0"/>
    </linearGradient>

    <!-- Handle gradient -->
    <linearGradient id="handleGrad" x1="0" y1="0" x2="1" y2="0" gradientTransform="rotate(45)">
      <stop offset="0%" stop-color="#8E9AAE"/>
      <stop offset="25%" stop-color="#E8ECF4"/>
      <stop offset="50%" stop-color="#C0C8D8"/>
      <stop offset="75%" stop-color="#E0E4EE"/>
      <stop offset="100%" stop-color="#8E9AAE"/>
    </linearGradient>

    <!-- Handle end cap gradient -->
    <radialGradient id="capGrad" cx="0.4" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#D0D4E0"/>
      <stop offset="100%" stop-color="#7A8498"/>
    </radialGradient>

    <!-- Glare gradient -->
    <radialGradient id="glareGrad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="white" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="6" dy="8" stdDeviation="16" flood-color="#0A1A40" flood-opacity="0.45"/>
    </filter>

    <!-- Soft inner shadow for lens depth -->
    <filter id="innerShadow">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="table" tableValues="1 0"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="8"/>
      <feOffset dx="3" dy="5" result="offsetblur"/>
      <feFlood flood-color="#1B3A8C" flood-opacity="0.3" result="color"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode/>
      </feMerge>
    </filter>

    <!-- Clip for rounded square (macOS squircle approximation) -->
    <clipPath id="iconClip">
      <rect width="1024" height="1024" rx="228" ry="228"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <g clip-path="url(#iconClip)">
    <rect width="1024" height="1024" fill="url(#bgGrad)"/>
    <!-- Subtle radial light from top center -->
    <ellipse cx="512" cy="200" rx="600" ry="500" fill="white" opacity="0.07"/>
  </g>

  <!-- Magnifying glass group -->
  <g clip-path="url(#iconClip)" filter="url(#shadow)">
    <!-- Handle -->
    <g transform="translate(512, 420)">
      <!-- Handle body -->
      <rect x="175" y="-30" width="280" height="60" rx="30" fill="url(#handleGrad)" transform="rotate(45)"/>
      <!-- Handle connector ring -->
      <circle cx="0" cy="0" r="0" fill="none"/>
    </g>

    <!-- Outer rim -->
    <circle cx="420" cy="370" r="255" fill="url(#rimGrad)"/>

    <!-- Inner rim shadow line -->
    <circle cx="420" cy="370" r="222" fill="none" stroke="#9AA0B0" stroke-width="2" opacity="0.5"/>

    <!-- Lens -->
    <circle cx="420" cy="370" r="218" fill="url(#lensGrad)" filter="url(#innerShadow)"/>

    <!-- Lens edge highlight (top) -->
    <ellipse cx="400" cy="210" rx="140" ry="30" fill="white" opacity="0.15"/>

    <!-- Main glare arc -->
    <ellipse cx="355" cy="295" rx="100" ry="60" fill="url(#glareGrad)" transform="rotate(-25, 355, 295)" opacity="0.6"/>

    <!-- Small bright specular highlight -->
    <circle cx="320" cy="265" r="16" fill="white" opacity="0.85"/>
    <circle cx="320" cy="265" r="8" fill="white" opacity="1"/>

    <!-- Subtle "+" crosshair for zoom feel -->
    <line x1="390" y1="370" x2="450" y2="370" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    <line x1="420" y1="340" x2="420" y2="400" stroke="white" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  </g>
</svg>
